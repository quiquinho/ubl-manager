services:
  ublmanager-api:
    build:
      context: ./server
    container_name: ublmanager-api
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "4000:4000"

  ublmanager-web:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: ublmanager-web
    restart: always
    depends_on:
      - ublmanager-api
    ports:
      - "4173:80"
      - "4176:80"
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
